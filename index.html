<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond Crush</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* Prevents default browser panning/zooming on touch */
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #121225 0%, #05050a 100%);
            color: #fff;
            overflow: hidden;
        }

        #score {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.4);
        }

        canvas {
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            max-width: 100vw;
            max-height: 70vh;
            object-fit: contain;
            background-color: #080811;
        }

        canvas.enemyClose {
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8), inset 0 0 20px rgba(255, 0, 85, 0.4);
            border-color: #ff0055;
        }

        .canvas-container {
            position: relative;
            padding: 10px;
            background: rgba(10, 10, 20, 0.7);
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
            border: 2px solid rgba(0, 240, 255, 0.4);
        }

        #startMenu {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 8, 18, 0.95);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            padding: 40px;
            border-radius: 14px;
            color: #fff;
            z-index: 1000;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #startMenu h1 {
            margin-bottom: 20px;
            font-size: 2rem;
        }

        #startButton {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #00f;
            color: #fff;
            border: none;
            border-radius: 5px;
        }

        #startButton:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.9);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div id="startMenu">
        <h1>Diamond Crush</h1>
        <button id="startButton">Start Game</button>
    </div>
    <div id="overlay"></div>

    <div id="score">Score: 0</div>
    <canvas id="diamondCanvas" width="600" height="600"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        startButton.addEventListener('click', startGame);
        const overlay = document.getElementById('overlay');
        const startMenu = document.getElementById('startMenu');

        function startGame() {
            startMenu.style.display = 'none';
            overlay.style.display = 'none';

            let countdown = 3;
            const countdownInterval = setInterval(() => {
                if (countdown > 0) {
                    alert(`Starting in ${countdown}...`);
                    countdown--;
                } else {
                    clearInterval(countdownInterval);
                    resetGame();
                    draw();
                }
            }, 1000);
        }

        const scoreElement = document.getElementById('score');
        const canvas = document.getElementById('diamondCanvas');
        const ctx = canvas.getContext('2d');

        // Logical internal coordinate system (600x600)
        const LOGICAL_WIDTH = 600;
        const LOGICAL_HEIGHT = 600;

        const player = {
            x: 50,
            y: 50,
            width: 30,
            height: 30,
            speed: 7
        };

        let currentLevel = 1;
        let score = 0;
        const levels = [];
        const enemies = [];
        const obstacles = [];

        function getRandomDiamonds(count) {
            const randomDiamonds = [];
            for (let i = 0; i < count; i++) {
                randomDiamonds.push({
                    x: Math.random() * (LOGICAL_WIDTH - 20),
                    y: Math.random() * (LOGICAL_HEIGHT - 20),
                    collected: false
                });
            }
            return randomDiamonds;
        }

        function generateLevel() {
            const diamondCount = currentLevel + 1;
            return getRandomDiamonds(diamondCount);
        }

        function generateEnemies(count) {
            const randomEnemies = [];
            for (let i = 0; i < count; i++) {
                randomEnemies.push({
                    x: Math.random() * (LOGICAL_WIDTH - 20),
                    y: Math.random() * (LOGICAL_HEIGHT - 20),
                    width: 20,
                    height: 20,
                    speed: 1.5
                });
            }
            return randomEnemies;
        }

        function generateObstacles(count) {
            const randomObstacles = [];
            for (let i = 0; i < count; i++) {
                randomObstacles.push({
                    x: Math.random() * (LOGICAL_WIDTH - 30),
                    y: Math.random() * (LOGICAL_HEIGHT - 30),
                    width: 30,
                    height: 30
                });
            }
            return randomObstacles;
        }

        function drawPlayer() {
            ctx.save();
            ctx.fillStyle = '#00f';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.restore();
        }

        function drawDiamonds() {
            ctx.fillStyle = '#f00';
            levels[currentLevel - 1].forEach(diamond => {
                if (!diamond.collected) {
                    ctx.fillRect(diamond.x, diamond.y, 20, 20);
                }
            });
        }

        function drawEnemies() {
            ctx.fillStyle = '#000';
            enemies.forEach(enemy => {
                ctx.save();
                ctx.beginPath();
                const numPoints = 5;
                const angleIncrement = (2 * Math.PI) / numPoints;
                const radius = enemy.width / 2;
                for (let i = 0; i < numPoints; i++) {
                    const angle = i * angleIncrement;
                    const x = enemy.x + radius * Math.cos(angle);
                    const y = enemy.y + radius * Math.sin(angle);
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.shadowColor = '#f00';
                ctx.shadowBlur = 10;
                ctx.restore();
            });
        }

        function drawObstacles() {
            ctx.fillStyle = '#777';
            obstacles.forEach(obstacle => {
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        function collectDiamonds() {
            levels[currentLevel - 1].forEach(diamond => {
                if (!diamond.collected && player.x < diamond.x + 20 && player.x + player.width > diamond.x &&
                    player.y < diamond.y + 20 && player.y + player.height > diamond.y) {
                    diamond.collected = true;
                    score += 10;
                }
            });

            const allCollected = levels[currentLevel - 1].every(diamond => diamond.collected);
            if (allCollected) {
                currentLevel++;
                levels[currentLevel - 1] = generateLevel();
                enemies.length = 0;
                enemies.push(...generateEnemies(currentLevel));
                obstacles.length = 0;
                obstacles.push(...generateObstacles(currentLevel));
                resetPlayerPosition();
            }
        }

        function updateEnemies() {
            enemies.forEach(enemy => {
                const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemy.x += enemy.speed * Math.cos(angle);
                enemy.y += enemy.speed * Math.sin(angle);
            });
        }

        function checkCollision() {
            enemies.forEach(enemy => {
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    endGame();
                }
            });

            obstacles.forEach(obstacle => {
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y) {
                    player.x = player.prevX;
                    player.y = player.prevY;
                }
            });

            player.prevX = player.x;
            player.prevY = player.y;
        }

        function endGame() {
            startMenu.style.display = 'flex';
            overlay.style.display = 'none';
            resetGame();
            setTimeout(() => {
                location.reload();
            }, 1000);
        }

        function resetPlayerPosition() {
            player.x = 50;
            player.y = 50;
            player.prevX = 50;
            player.prevY = 50;
        }

        function resetGame() {
            currentLevel = 1;
            score = 0;
            levels[currentLevel - 1] = generateLevel();
            enemies.length = 0;
            enemies.push(...generateEnemies(currentLevel));
            obstacles.length = 0;
            obstacles.push(...generateObstacles(currentLevel));
            resetPlayerPosition();
        }

        function updateScoreDisplay() {
            scoreElement.textContent = `Score: ${score}`;
        }

        function updateCanvasShadow() {
            const isEnemyClose = enemies.some(enemy => {
                const dx = enemy.x - player.x;
                const dy = enemy.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < 40;
            });

            if (isEnemyClose) {
                canvas.classList.add('enemyClose');
            } else {
                canvas.classList.remove('enemyClose');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
            drawObstacles();
            drawPlayer();
            drawDiamonds();
            drawEnemies();
            collectDiamonds();
            updateEnemies();
            checkCollision();
            updateCanvasShadow();
            updateScoreDisplay();
            requestAnimationFrame(draw);
        }

        // Universal input handler mapping screen coordinates to canvas logical scale
        function handleInput(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();

            // Calculate scale ratio between CSS display size and internal canvas resolution
            const scaleX = LOGICAL_WIDTH / rect.width;
            const scaleY = LOGICAL_HEIGHT / rect.height;

            const newX = (clientX - rect.left) * scaleX - player.width / 2;
            const newY = (clientY - rect.top) * scaleY - player.height / 2;

            if (newX >= 0 && newX <= LOGICAL_WIDTH - player.width && newY >= 0 && newY <= LOGICAL_HEIGHT - player.height) {
                player.x = newX;
                player.y = newY;
            }
        }

        // Mouse Events
        window.addEventListener('mousemove', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        // Touch Events for Mobile / Tablets
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleInput(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleInput(touch.clientX, touch.clientY);
            }
        }, { passive: false });
    </script>
</body>

</html>
